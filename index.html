<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suno 音樂轉錄與下載器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md mx-auto space-y-6">
        <!-- 標題 -->
        <header class="text-center pt-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                Suno 智慧音樂轉錄器
            </h1>
            <p class="text-xs text-slate-400 mt-1">支援 iOS & Android 全平台解析</p>
        </header>

        <!-- 輸入區域 -->
        <div class="glass-card p-4 rounded-2xl shadow-xl space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">請輸入 Suno 音樂網址：</label>
                <input type="url" id="sunoUrl" placeholder="https://suno.com/song/... 或 /s/..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 text-slate-100 placeholder-slate-500">
            </div>
            <button onclick="processSunoUrl()" id="fetchBtn" 
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 font-semibold rounded-xl shadow-lg hover:opacity-95 active:scale-95 transition-all flex items-center justify-center space-x-2">
                <span id="btnText">解析音樂與歌詞</span>
            </button>
        </div>

        <!-- 載入與狀態顯示區 -->
        <div id="loading" class="hidden text-center py-6">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-purple-500"></div>
            <p id="statusMsg" class="text-sm text-slate-400 mt-2">正在解析音樂資料...</p>
        </div>

        <!-- 結果顯示區 (預設隱藏) -->
        <div id="resultContainer" class="hidden space-y-4">
            <!-- 歌曲資訊卡 -->
            <div class="glass-card p-4 rounded-2xl flex items-center space-x-4">
                <img id="songImage" src="" alt="封面" class="w-16 h-16 rounded-xl object-cover bg-slate-800 flex-shrink-0">
                <div class="overflow-hidden">
                    <h2 id="songTitle" class="font-bold text-base truncate text-slate-100"></h2>
                    <p id="songTags" class="text-xs text-slate-400 truncate mt-0.5"></p>
                </div>
            </div>

            <!-- 播放器介面 -->
            <div class="glass-card p-4 rounded-2xl space-y-3">
                <div class="text-xs text-purple-400 font-medium">線上試聽</div>
                <audio id="audioPlayer" controls class="w-full h-10"></audio>
            </div>

            <!-- 下載按鈕區 -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="downloadAudio('mp3')" class="py-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 transition">
                    <span>📥 下載 MP3</span>
                </button>
                <button onclick="downloadAudio('ogg')" class="py-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 transition">
                    <span>📥 下載 OGG</span>
                </button>
            </div>

            <!-- 歌詞區 -->
            <div class="glass-card p-4 rounded-2xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs text-purple-400 font-medium">歌詞內容 (保持原排版)</span>
                    <button onclick="copyLyrics()" class="text-xs bg-purple-600/30 hover:bg-purple-600/50 text-purple-300 px-3 py-1.5 rounded-lg transition border border-purple-500/30 flex items-center space-x-1">
                        <span>📋 一鍵複製歌詞</span>
                    </button>
                </div>
                <div id="lyricsBox" class="bg-slate-900/80 p-3 rounded-xl text-sm text-slate-300 whitespace-pre-wrap font-mono max-h-48 overflow-y-auto leading-relaxed border border-slate-800/80">
                    載入中...
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-500 py-6">
        Suno Mobile Transcriber &copy; 2026
    </footer>

    <script>
        let currentAudioUrl = '';
        let currentTitle = 'Suno_Song';
        let currentLyricsText = '';

        // 升級版：支援多重代理服務，確保在 Android 手機 Chrome 順利連線
        async function fetchWithProxy(url) {
            const encodedUrl = encodeURIComponent(url);
            
            // 4 種不同的代理 API 備援清單
            const proxyConfigs = [
                { url: `https://api.allorigins.win/get?url=${encodedUrl}`, type: 'json' },
                { url: `https://api.codetabs.com/v1/proxy?quest=${encodedUrl}`, type: 'text' },
                { url: `https://corsproxy.io/?${encodedUrl}`, type: 'text' },
                { url: `https://thingproxy.freeboard.io/fetch/${url}`, type: 'text' }
            ];

            let lastError = null;

            for (const proxy of proxyConfigs) {
                try {
                    const res = await fetch(proxy.url, { cache: 'no-cache' });
                    if (!res.ok) continue;

                    if (proxy.type === 'json') {
                        const json = await res.json();
                        if (json.contents) return json.contents;
                    } else {
                        const text = await res.text();
                        if (text && text.trim().length > 0) return text;
                    }
                } catch (e) {
                    console.warn('代理連線失敗:', proxy.url, e);
                    lastError = e;
                }
            }
            throw new Error('所有備用網路節點皆連線失敗，請稍候重試或檢查網路。');
        }

        async function processSunoUrl() {
            const inputUrl = document.getElementById('sunoUrl').value.trim();
            if (!inputUrl) {
                alert('請先輸入 Suno 音樂網址！');
                return;
            }

            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const statusMsg = document.getElementById('statusMsg');
            const fetchBtn = document.getElementById('fetchBtn');

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            fetchBtn.disabled = true;
            statusMsg.innerText = '正在解析網址與 UUID...';

            try {
                let clipId = extractClipId(inputUrl);
                let songData = null;

                // 情況 1：若輸入的是 /s/ 短網址，先抓取頁面追蹤真實的 /song/ UUID
                if (!clipId && inputUrl.includes('/s/')) {
                    statusMsg.innerText = '正在自動追蹤短網址...';
                    const htmlContent = await fetchWithProxy(inputUrl);
                    clipId = extractClipId(htmlContent);
                    if (!songData) {
                        songData = parseHtmlContent(htmlContent);
                    }
                }

                // 情況 2：已取得 Clip ID，嘗試呼叫 Suno 官方 CDN API
                if (clipId && (!songData || !songData.audio_url)) {
                    statusMsg.innerText = '正在取得官方音訊與歌詞...';
                    try {
                        const apiUrl = `https://cdn1.suno.ai/api/external/song/${clipId}/`;
                        const apiRes = await fetchWithProxy(apiUrl);
                        const data = (typeof apiRes === 'string') ? JSON.parse(apiRes) : apiRes;
                        
                        if (data && (data.audio_url || data.id)) {
                            songData = {
                                title: data.title || '未命名音樂',
                                audio_url: data.audio_url || `https://cdn1.suno.ai/${clipId}.mp3`,
                                image_url: data.image_large_url || data.image_url || '',
                                lyric: data.metadata?.prompt || '無歌詞資料或此為純音樂',
                                tags: data.metadata?.tags || 'Suno AI Music'
                            };
                        }
                    } catch (e) {
                        console.log('API Direct Fetch Fail, Switching to Page Parsing');
                    }
                }

                // 情況 3：最終備援：若仍未抓到，再次請求全頁面 HTML 解析
                if (!songData || !songData.audio_url) {
                    statusMsg.innerText = '正在嘗試後備頁面解析...';
                    const htmlContent = await fetchWithProxy(inputUrl);
                    songData = parseHtmlContent(htmlContent);
                }

                if (!songData || !songData.audio_url) {
                    throw new Error('無法找到歌曲或音訊，請確認該歌曲已在 Suno 上設為公開！');
                }

                // 更新資料與 UI
                currentTitle = sanitizeFilename(songData.title || 'Suno_Music');
                currentAudioUrl = songData.audio_url;
                currentLyricsText = songData.lyric || '無可用歌詞。';

                document.getElementById('songTitle').innerText = songData.title;
                document.getElementById('songTags').innerText = songData.tags;
                document.getElementById('songImage').src = songData.image_url || 'https://via.placeholder.com/150';

                const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.src = currentAudioUrl;

                document.getElementById('lyricsBox').innerText = currentLyricsText;

                loading.classList.add('hidden');
                resultContainer.classList.remove('hidden');

            } catch (err) {
                loading.classList.add('hidden');
                alert('解析失敗：' + err.message);
            } finally {
                fetchBtn.disabled = false;
            }
        }

        // 從字串/網址中尋找 36 位元的 UUID 格式
        function extractClipId(str) {
            if (!str) return null;
            const uuidRegex = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
            const match = str.match(uuidRegex);
            return match ? match[0] : null;
        }

        function parseHtmlContent(htmlStr) {
            if (!htmlStr) return null;
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlStr, 'text/html');

            // 從 JSON 結構中抽取
            const nextDataScript = doc.getElementById('__NEXT_DATA__');
            if (nextDataScript) {
                try {
                    const nextJson = JSON.parse(nextDataScript.textContent);
                    const clip = findClipData(nextJson);
                    if (clip) {
                        return {
                            title: clip.title || '未命名音樂',
                            audio_url: clip.audio_url,
                            image_url: clip.image_large_url || clip.image_url,
                            lyric: clip.metadata?.prompt || '無歌詞',
                            tags: clip.metadata?.tags || 'Suno AI Music'
                        };
                    }
                } catch (e) {}
            }

            // Meta tags 救援
            const ogAudio = doc.querySelector('meta[property="og:audio"]')?.content || 
                            doc.querySelector('meta[property="og:audio:secure_url"]')?.content;
            const ogTitle = doc.querySelector('meta[property="og:title"]')?.content || 'Suno Music';
            const ogImage = doc.querySelector('meta[property="og:image"]')?.content || '';

            if (ogAudio) {
                return {
                    title: ogTitle,
                    audio_url: ogAudio,
                    image_url: ogImage,
                    lyric: '提示：短網址未能直接載入全文歌詞，如需完整歌詞請複製 full URL (/song/...) 嘗試。',
                    tags: 'Suno AI Music'
                };
            }
            return null;
        }

        function findClipData(obj) {
            if (!obj || typeof obj !== 'object') return null;
            if (obj.audio_url && (obj.id || obj.clip_id)) return obj;
            for (let key of Object.keys(obj)) {
                let res = findClipData(obj[key]);
                if (res) return res;
            }
            return null;
        }

        function sanitizeFilename(name) {
            return name.replace(/[\/\\?%*:|"<>]/g, '_');
        }

        function copyLyrics() {
            if (!currentLyricsText) return;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(currentLyricsText).then(() => {
                    alert('歌詞已成功複製！');
                }).catch(() => fallbackCopy());
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const textArea = document.createElement("textarea");
            textArea.value = currentLyricsText;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert('歌詞已成功複製！');
            } catch (err) {
                alert('複製失敗，請手動選取文字複製。');
            }
            document.body.removeChild(textArea);
        }

        async function downloadAudio(format) {
            if (!currentAudioUrl) return;
            alert(`正在準備下載 ${format.toUpperCase()} 檔案...`);
            try {
                const response = await fetch(currentAudioUrl);
                const blob = await response.blob();
                
                const mimeType = format === 'ogg' ? 'audio/ogg' : 'audio/mpeg';
                const extension = format === 'ogg' ? 'ogg' : 'mp3';
                const exportBlob = new Blob([blob], { type: mimeType });
                
                const blobUrl = window.URL.createObjectURL(exportBlob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${currentTitle}.${extension}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                // 如果遭遇 Safari / Chrome 檔案儲存權限阻擋，自動跳轉另開連結下載
                window.open(currentAudioUrl, '_blank');
            }
        }
    </script>
</body>
</html>
